name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, draft, 'content/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Block indexing on non-production branches
        if: github.ref_name != 'main'
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' >> _headers
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sincerelycozy --branch=${{ github.ref_name }}
